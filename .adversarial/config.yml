# Adversarial Workflow Configuration
# Regenerated from config.yml.template (KIT-0068 A67 — the old copy
# predated the template rewrite: tasks/ dir, deprecated evaluator_model).
# Keys verified against the installed adversarial-workflow 1.0.1:
# auto_run / git_integration / save_artifacts are read nowhere in the
# CLI and are deliberately absent; evaluator_model is deprecated
# (models live in per-evaluator YAML under .adversarial/evaluators/).

# Directory containing task specifications
task_directory: .kit/tasks/

# Directory for evaluation logs
log_directory: .adversarial/logs/

# Directory for temporary artifacts
artifacts_directory: .adversarial/artifacts/

# Command to run tests (for test validation phase)
test_command: pytest tests/ -v
