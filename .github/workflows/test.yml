name: Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kit/tasks/**'
      - '.claude/**'
      - '.kit/context/**'
  # No branches filter on pull_request: the filter matches the PR's BASE
  # branch, so stacked PRs (feature-branch bases) never triggered and
  # every head needed a manual dispatch (KIT-0090 #109-#111; decoded
  # 2026-08-07). Tests run for every PR regardless of base.
  pull_request:
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = floor, 3.14 = ceiling-lift proof (KIT-0065: the old
        # <3.13 bound belonged to a retired dependency)
        python-version: ['3.10', '3.12', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=scripts --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with Black
        run: |
          black --check --diff .

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff .

      - name: Lint with flake8
        run: |
          flake8 scripts/ tests/ --exclude=scripts/optional --max-line-length=88 --extend-ignore=E203,W503 --select=E9,F63,F7,F82

      - name: Lint with ruff
        run: |
          ruff check scripts/ tests/
